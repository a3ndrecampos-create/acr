name: Gerar Keystore (rodar uma vez só)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Apelido da chave (ex: qrscangera)'
        required: true
        default: 'qrscangera'
      store_password:
        description: 'Senha da keystore (guarde depois!)'
        required: true
      key_password:
        description: 'Senha da chave (pode ser igual à da keystore)'
        required: true
      nome_completo:
        description: 'Seu nome ou nome da empresa (CN)'
        required: true
        default: 'QR Scan e Gera'

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar keystore com keytool
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.nome_completo }}, OU=Dev, O=QRScanGera, L=Sao Paulo, ST=SP, C=BR"
          base64 -w 0 release.jks > release_base64.txt

      - name: Upload keystore (baixe e apague este artifact depois!)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-gerada
          path: |
            release.jks
            release_base64.txt
          retention-days: 1
