name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Debug APK (flavor production) - sempre, serve pra testar rápido sem precisar da keystore
      - name: Build debug APK
        run: ./gradlew assembleProductionDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/production/debug/app-production-debug.apk

      # A partir daqui só roda se a keystore estiver configurada nos secrets do repositório
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # AAB de PRODUÇÃO assinado - regra comercial real (trial de 7 dias, depois paga)
      # É este arquivo que vai pra faixa de Produção do Play Console.
      - name: Build signed PRODUCTION release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease --stacktrace

      - name: Upload production AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release-aab
          path: app/build/outputs/bundle/productionRelease/app-production-release.aab

      # AAB de TESTE FECHADO assinado - Premium sempre liberado, sem trial.
      # É este arquivo que vai SÓ pra faixa de Teste fechado do Play Console - NUNCA pra Produção.
      - name: Build signed CLOSED TESTING release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleClosedTestingRelease --stacktrace

      - name: Upload closed testing AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-closedtesting-release-aab
          path: app/build/outputs/bundle/closedTestingRelease/app-closedTesting-release.aab
